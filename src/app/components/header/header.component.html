    <mat-toolbar class="mat-elevation-z4 header-toolbar">
      <div class="logo">
        <mat-icon>auto_awesome</mat-icon>
        <span>Belleza Gringa</span>
      </div>
      <span class="spacer"></span>
      <button *ngIf="isMobile" mat-icon-button (click)="cartToggle.emit()"
        [matBadge]="(cartService.itemCount$ | async)!" matBadgeColor="primary" matBadgeSize="small"
        aria-label="Abrir carrito de cotización">
        <mat-icon>shopping_cart</mat-icon>
      </button>
    </mat-toolbar>
